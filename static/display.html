<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Малый совет — табло заседания</title><link rel="stylesheet" href="/static/app.css"><style>
body{background:#102f32;color:#eaf8ee}.topbar{background:transparent;border-color:#ffffff16;height:105px;padding:0 45px}.brand{color:#eef9f2}.brand small{color:#9bbbab}.display-label{color:#9fc6b0;font-size:10px;letter-spacing:2px}.display-root{max-width:1500px;margin:auto;padding:45px}.display-root h1{font-size:clamp(28px,3vw,46px);max-width:1100px}.display-meta{display:flex;justify-content:space-between;align-items:center;gap:25px;margin:25px 0 35px;font-size:15px;color:#b5d7be}.display-meta strong{font-size:30px;color:#4dd0b3}.display-card{background:#194344;border:1px solid #ffffff12;border-radius:22px;padding:40px;margin:24px 0}.display-card h2{font-size:clamp(24px,3vw,40px);line-height:1.55;margin-bottom:25px;color:#e8f7e8}.display-card .section-kicker{font-size:12px;color:#6dd4b9}.display-card .vote-result{max-width:900px}.display-card .vote-result>div{background:#0c2d2d;padding:25px;border:1px solid #ffffff10}.display-card .vote-result strong{font-size:clamp(40px,5vw,75px);color:#60d4b7}.display-card .vote-result small{font-size:14px;color:#aecbb5}.display-verdict{font-size:clamp(28px,4vw,55px);letter-spacing:-1.5px;color:#64d8b1;line-height:1.4;margin-top:25px}.display-verdict.rejected{color:#ffbcaa}.display-progress{font-size:clamp(30px,5vw,60px);color:#a4e2bf;letter-spacing:-2px;line-height:1.5}.display-note{color:#a6c8af;font-size:14px;margin-top:20px}.display-row{border-bottom:1px solid #ffffff12;padding:18px 0;display:flex;justify-content:space-between;gap:25px;font-size:16px}.display-row:last-child{border:0}.display-live{display:flex;gap:12px;align-items:center;color:#73d8b8;letter-spacing:1px;font-size:11px}.display-live:before{content:'';width:7px;height:7px;background:#52d6b6;border-radius:50%}.display-speaker{background:#c3e8ce;color:#163e35}.display-speaker .section-kicker{color:#357a62}.display-speaker h2{color:#183f32;margin:0}.display-timer{font-size:25px;margin-top:20px}.display-warning{background:#663f33;padding:17px 24px;border-radius:12px;color:#ffdfc8;font-size:15px;margin-top:20px}.display-error{max-width:800px;margin:90px auto;padding:30px;font-size:17px;color:#e6c4a6}.display-error h1{font-size:28px}.display-error p{font-size:12px;color:#adbfb1}.display-root .badge{font-size:10px;padding:7px 12px}.display-root .row-meta{color:#a6bfaa;font-size:12px}.display-poll{color:#96b7a0;text-align:right;font-size:9px}.display-poll.error{color:#f3bc91}@media(max-width:700px){.topbar{padding:0 20px;height:85px}.display-label{display:none}.display-root{padding:25px 17px}.display-meta{font-size:10px;gap:15px}.display-meta strong{font-size:22px}.display-card{padding:23px;border-radius:14px}.display-card .vote-result>div{padding:16px}.display-card .vote-result small{font-size:9px}.display-row{font-size:12px}.display-card .section-kicker{font-size:9px}.display-note{font-size:11px}.display-timer{font-size:20px}}
</style></head><body><header class="topbar"><a class="brand" href="/"><svg viewBox="0 0 64 72" fill="currentColor" aria-hidden="true"><path d="M3 12 32 3 61 12V18H3ZM10 23H54V53H47V30L36 42V53H28V42L17 30V53H10ZM3 58H61V65H3Z"/></svg><span><strong>МАЛЫЙ СОВЕТ</strong><small>ДВИЖЕНИЕ «НОВЫЕ» · МОСКВА</small></span></a><span class="display-label">ТАБЛО ЗАСЕДАНИЯ</span></header><main id="display" class="display-root"><div class="loading">Загружаем заседание…</div></main><script type="module">
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t');
const status={preparing:'Подготовка',active:'Заседание идёт',paused:'Перерыв',closed:'Заседание закрыто',pending:'Ожидает',opened:'Идёт голосование'};
let meeting=null;
function render(){const m=meeting,q=m.questions?.find(q=>q.status==='opened')||m.questions?.find(q=>q.id===m.current_question_id),quorum=m.quorum||{};document.querySelector('#display').innerHTML=`<div class="eyebrow" style="color:#8cb49e">${esc(status[m.status]||m.status)}</div><h1>${esc(m.title)}</h1><div class="display-meta"><div>Кворум: <strong>${quorum.present||0} / 16</strong> · ${quorum.has_quorum?'набран':'нужно не менее 9 членов'}</div><div class="display-live">${m.status==='active'?'ПРЯМАЯ ТРАНСЛЯЦИЯ':esc(status[m.status]||'')}</div></div>${q?`<section class="display-card"><div class="section-kicker">${q.status==='opened'?'ГОЛОСОВАНИЕ ОТКРЫТО':'РЕЗУЛЬТАТ ГОЛОСОВАНИЯ'}</div><h2>${esc(q.title)}</h2>${q.status==='opened'?`<div class="display-progress">Проголосовало ${q.result?.voters||0} из ${quorum.present||0}</div><div class="display-note">Итоги появятся после завершения голосования.</div>`:`${q.procedure==='chair_election'?`${(q.result?.choices||[]).map(c=>`<div class="display-row"><span>${esc(c.text)}</span><strong>${c.votes}</strong></div>`).join('')}`:`<div class="vote-result"><div><strong>${q.result?.for||0}</strong><small>за</small></div><div><strong>${q.result?.against||0}</strong><small>против</small></div><div><strong>${q.result?.abstain||0}</strong><small>воздержались</small></div></div>`}<div class="display-verdict ${!q.result?.passed?'rejected':''}">${q.result?.tiedIds?.length>1?'ТРЕБУЕТСЯ ПОВТОРНЫЙ ТУР':q.result?.passed?'РЕШЕНИЕ ПРИНЯТО':'РЕШЕНИЕ НЕ ПРИНЯТО'}</div><div class="display-note">${esc(q.result?.reason||'')}${q.result?.needed?' · Требовалось: '+q.result.needed:''}</div>${q.veto&&!q.veto.overridden_at?`<div class="display-warning">Вето председателя: ${esc(q.veto.reason)}</div>`:''}`}</section>`:`<section class="display-card"><div class="section-kicker">ПОВЕСТКА ЗАСЕДАНИЯ</div>${m.questions?.length?m.questions.map(q=>`<div class="display-row"><span>${esc(q.order_num+'. '+q.title)}</span><span class="row-meta">${q.status==='closed'?(q.result?.passed?'Принято':'Не принято'):esc(status[q.status]||q.status)}</span></div>`).join(''):'<div class="display-note">Повестка готовится.</div>'}</section>`}${m.speaker?`<section class="display-card display-speaker"><div class="section-kicker">СЛОВО ПРЕДОСТАВЛЕНО</div><h2>${esc(m.speaker.name)}</h2><div class="display-timer" data-start="${esc(m.speaker.started_at)}" data-seconds="${m.speaker.speech_seconds||180}"></div></section>`:''}<div class="display-poll" id="poll-status">Обновляется автоматически · Доступ только для просмотра</div>`;tick();}
function tick(){for(const el of document.querySelectorAll('[data-start]')){const left=Math.ceil(Number(el.dataset.seconds)-(Date.now()-Date.parse(el.dataset.start))/1000);const seconds=Math.abs(left);el.textContent=(left>=0?'Осталось ':'Регламент истёк +')+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');}}
async function load(){if(!token){document.querySelector('#display').innerHTML='<div class="display-error"><h1>Нужна ссылка на табло</h1><p>Председатель или секретарь создаёт её кнопкой «Открыть табло» в заседании.</p></div>';return;}try{const res=await fetch('/api/display/'+encodeURIComponent(token));const data=await res.json();if(!res.ok)throw new Error(data.error||'Ссылка недействительна');meeting=data.meeting;render();}catch(err){if(!meeting)document.querySelector('#display').innerHTML=`<div class="display-error"><h1>Табло недоступно</h1><p>${esc(err.message)}</p><p>Запросите новую ссылку у секретаря. Ссылки действуют 12 часов.</p></div>`;else{const status=document.querySelector('#poll-status');status.classList.add('error');status.textContent='Соединение прервано. Показаны последние полученные данные.';}}}
await load();setInterval(load,3000);setInterval(tick,1000);
</script></body></html>
